[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-staffing-spec"
version = "1.3.0"
description = "Jobs & Staffing v1: an open format for describing work for people or AI agents, and requesting staffing with consent. Schema and validate()."
readme = "README.md"
license = { text = "CC-BY-4.0" }
authors = [{ name = "David Morales" }]
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18"]
keywords = ["a2a", "mcp", "ai-agents", "jobs", "gig-economy", "staffing", "json-schema"]

[project.urls]
Homepage = "https://heydavidmorales.com/ext/jobs/v1/"
Repository = "https://github.com/Danzers99/jobs-staffing-spec"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["jobs_staffing"]

[tool.setuptools.package-data]
jobs_staffing = ["schema.json"]
